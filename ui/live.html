<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<title>vis</title>
<style>
:root {
  color-scheme: light;
  --bg: #f7f7f6;
  --ink: #111112;
  --ink-2: #4a4a4f;
  --ink-3: #8a8a90;
  --ink-4: #c4c4c8;
  --rule: #b9b9be;
  --hair: #e4e4e1;
  --red: #d93036;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Geist Mono", Menlo, monospace;
  --serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --surface: #fdfdfc;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0a0a0a; --ink: #ececec; --ink-2: #b0b0b5; --ink-3: #75757b; --ink-4: #3b3b40; --rule: #45454a; --hair: #1d1d20;
    --red: #ff5a5f; --surface: #111113;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a0a0a; --ink: #ececec; --ink-2: #b0b0b5; --ink-3: #75757b; --ink-4: #3b3b40; --rule: #45454a; --hair: #1d1d20;
  --red: #ff5a5f; --surface: #111113;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { overscroll-behavior: none; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; min-height: 100dvh; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
/* focus: for keyboard users only, a thin dotted ring in the page's grey; nothing on what the page focuses for
   itself (a sheet's title, the panel's body: tabindex=-1) */
:focus-visible { outline: 1px dotted var(--ink-3); outline-offset: 3px; }
[tabindex="-1"]:focus, [tabindex="-1"]:focus-visible { outline: none; }
/* keyboard hints: shown only once someone is using the keyboard */
.kbd { display: none; font: 11px/1 var(--mono); padding: 3px 5px; border: 1px solid currentColor; opacity: .55; margin-left: 8px; letter-spacing: 0; }
body.keys-on .kbd { display: inline-block; }
.label .k { display: none; } body.keys-on .label .k { display: inline; color: var(--ink-2); }
.keys-hint { display: none; } @media (pointer: fine) { .keys-hint { display: inline; } }
.strip:focus-visible { outline: 1px dotted var(--ink-3); outline-offset: 6px; }
.keys { display: grid; gap: 18px; margin-top: 16px; }
.keys h4 { font: 12px var(--mono); letter-spacing: .06em; color: var(--ink-3); margin: 0 0 6px; font-weight: 400; }
.keys dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; font-size: 14px; }
.keys dt { font: 12.5px var(--mono); } .keys dt span { border: 1px solid var(--rule); padding: 1px 6px; margin-right: 4px; }
.keys dd { margin: 0; color: var(--ink-2); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- page frame (borrowed from mdxcn: dotted rules, + at the joints) ---------- */
.page { width: min(1120px, 100%); margin: 0 auto; border-left: 1px dotted var(--rule); border-right: 1px dotted var(--rule); min-height: 100dvh; position: relative; }
header {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px;
  padding: calc(14px + env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) 14px max(24px, env(safe-area-inset-left));
  background: var(--bg); border-bottom: 1px dotted var(--rule);
}
header::before, header::after { content: "+"; position: absolute; bottom: -9px; font: 12px/1 var(--mono); color: var(--ink-3); background: var(--bg); }
header::before { left: -4px; } header::after { right: -4px; }
.svc { font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
.svc .mark { width: 14px; height: 14px; display: grid; grid-template-columns: repeat(3, 1fr); align-items: end; gap: 1px; }
.svc .mark i { background: var(--ink); } .svc .mark i:nth-child(1) { height: 5px; } .svc .mark i:nth-child(2) { height: 9px; } .svc .mark i:nth-child(3) { height: 14px; }
.svc small { font: 12px var(--mono); color: var(--ink-3); }
.grow { flex: 1; }
.freeze { min-height: 36px; padding: 0 14px; border: 1px solid var(--rule); font-size: 14px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; transition: background .2s, color .2s, border-color .2s; }
.freeze:hover { border-color: var(--ink-2); color: var(--ink); }
.freeze .sq { width: 8px; height: 8px; border: 1px solid currentColor; }
body.frozen .freeze { background: var(--ink); color: var(--bg); border-color: var(--ink); }
body.frozen .freeze .sq { background: currentColor; }
.freezebar { display: none; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 28px; background: var(--ink); color: var(--bg); font: 13px var(--mono); }
body.frozen .freezebar { display: flex; }
.freezebar b { font-weight: 600; letter-spacing: .06em; }
.freezebar input { flex: 1; min-width: 180px; background: transparent; border: 0; border-bottom: 1px dotted currentColor; color: inherit; font: inherit; padding: 4px 0; outline: none; }
.freezebar input::placeholder { color: inherit; opacity: .6; }
/* viewing another member through this page: say so, and what acting here means */
.viewbar { display: none; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 28px; border-bottom: 1px solid var(--rule); background: var(--paper, var(--bg)); font: 13px var(--mono); color: var(--ink-2); }
body.viewing .viewbar { display: flex; }
.viewbar b { color: var(--ink); font-weight: 600; }
.viewbar button { margin-left: auto; text-decoration: underline; text-underline-offset: 3px; font: inherit; color: var(--ink); }
.freezebar button { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
@media (max-width: 600px) { .freezebar { padding: 10px 16px; } }

/* ---------- layout ---------- */
main { padding: 8px max(24px, env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); }
@media (min-width: 980px) {
  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-areas: "center side" "today side"; column-gap: 48px; align-items: start; }
  .center { grid-area: center; } .todaycol { grid-area: today; } aside { grid-area: side; grid-row: 1 / span 2; position: sticky; top: 92px; }
}
/* wide: the day beside the chart, so a story and its window on the strip are both in view */
@media (min-width: 1320px) {
  .page { width: min(1560px, 100%); }
  main { grid-template-columns: 330px minmax(0, 1fr) 320px; grid-template-areas: "today center side"; column-gap: 40px; }
  aside { grid-row: auto; }
  .todaycol { position: sticky; top: 64px; max-height: calc(100dvh - 72px); overflow: auto; overscroll-behavior: contain; padding: 0 6px 24px; margin: 0 -6px; scrollbar-width: thin; }
  .todaycol .story h3 { font-size: 15px; }
}

/* ---------- frames ---------- */
.frame { position: relative; border: 1px dotted var(--rule); margin-top: 36px; }
.frame > .c { position: absolute; font: 12px/1 var(--mono); color: var(--ink-3); pointer-events: none; }
.frame > .c.tl { top: -7px; left: -4px; } .frame > .c.tr { top: -7px; right: -4px; } .frame > .c.bl { bottom: -6px; left: -4px; } .frame > .c.br { bottom: -6px; right: -4px; }
.frame > .label { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); background: var(--bg); padding: 0 8px; font: 12px/18px var(--mono); letter-spacing: .06em; color: var(--ink-2); white-space: nowrap; }
.frame > .inner { padding: 22px 20px 18px; }

/* ---------- hero ---------- */
.hero { padding-top: 36px; }
#headline { font: 600 clamp(34px, 7vw, 54px)/1.04 var(--display); letter-spacing: -0.04em; margin: 0; }
#headline.alert { color: var(--red); }
#headline.two { font-size: clamp(28px, 5.6vw, 44px); }
#subline { font: 14.5px/1.5 var(--mono); color: var(--ink-2); margin: 12px 0 0; min-height: 22px; }

/* ---------- tick strip ---------- */
.strip { position: relative; height: clamp(150px, 20vw, 210px); touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: crosshair; }
.strip svg { width: 100%; height: 100%; display: block; overflow: visible; }
.strip .tick { stroke: var(--ink-4); stroke-width: 1; shape-rendering: crispEdges; }
.strip .tick.hot { stroke: var(--red); stroke-width: 2; } /* weight, not only hue: thin lines lose their color first */
.strip .tick.ev { }
.strip .tick.dep { stroke-dasharray: 2 2; }
.strip .lbl.dep { font: 11.5px var(--mono); font-style: normal; }
.strip .tick.ev.hot { stroke: var(--red); } /* a landmark inside a breach stays red */
.strip .tick, .strip .lbl { transition: opacity .15s; }
.strip .band { fill: var(--ink); opacity: 0; transition: opacity .15s; }
.strip.hl .band { opacity: .07; }
.strip.hl .tick:not(.in), .strip.hl .lbl:not(.in) { opacity: .25; }
.strip .slo { stroke: var(--red); stroke-width: 1.25; stroke-dasharray: 6 3; }
.strip .lbl { font: 500 12px var(--sans); fill: var(--ink-2); letter-spacing: -0.005em; }
.strip .leader { stroke: var(--ink-3); stroke-width: 1; shape-rendering: crispEdges; }
.strip .grid { stroke: var(--hair); stroke-width: 1; shape-rendering: crispEdges; }
.strip .yl { font: 11.5px var(--sans); fill: var(--ink-3); font-variant-numeric: tabular-nums; }
.strip .over { fill: var(--red); opacity: .03; }
/* Memory as tiles, as the fleet's dock is: shared dotted edges, "+" at the corners, the title set into the rule. */
.mtiles { margin-top: 36px; padding: 0; } /* as far from the latency frame as frames are from each other */
@media (min-width: 761px) { .mtiles { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); } }
.mtiles .tile { padding: 24px 20px 18px; background: var(--surface); } /* the hero's surface, as the latency frame has */
.mtiles .fig { margin-bottom: 6px; }
.mtiles .tile:first-child { display: flex; flex-direction: column; } /* the chart takes the height the heap's tile sets */
.strip.mem { flex: 1; height: auto; min-height: 110px; cursor: default; }
.strip.mem .fc { stroke: var(--ink-2); stroke-width: 1.25; stroke-dasharray: 1 3; stroke-linecap: round; fill: none; }
.strip.mem .fc.hot { stroke: var(--red); }
.maxis { position: relative; height: 14px; margin-top: 8px; font: 11.5px var(--sans); font-variant-numeric: tabular-nums; color: var(--ink-3); }
.maxis span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.maxis span:first-child { transform: none; }
/* The live heap as a waffle (after mdxcn's): the limit in 100 cells, in ink weights, not hues. */
.waffle { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; max-width: 190px; margin: 6px 0 14px; }
/* Ink levels, no white fills; red only for the wrong part, as the latency ticks over the SLO are: here what of the
   live heap grew in the last 10 minutes. */
.waffle i { aspect-ratio: 1; border: 1px solid var(--hair); }
.waffle i.live { background: var(--ink-3); border-color: var(--ink-3); }
.waffle i.grew { background: color-mix(in srgb, var(--red) 30%, transparent); border-color: var(--red); }
.waffle i.goal { background: var(--ink-4); border-color: var(--ink-4); }
.waffle i.rest { background: repeating-linear-gradient(135deg, var(--ink-4) 0 1px, transparent 1px 3px); border-color: var(--ink-4); }
.wkey { display: grid; grid-template-columns: 12px auto 1fr; gap: 5px 8px; align-items: center; margin: 0; font: 12.5px var(--sans); color: var(--ink-2); }
.wkey i { width: 10px; height: 10px; border: 1px solid var(--ink-4); }
.wkey i { border-color: var(--hair); }
.wkey i.live { background: var(--ink-3); border-color: var(--ink-3); } .wkey i.goal { background: var(--ink-4); border-color: var(--ink-4); }
.wkey i.grew { background: color-mix(in srgb, var(--red) 30%, transparent); border-color: var(--red); }
.wkey i.rest { background: repeating-linear-gradient(135deg, var(--ink-4) 0 1px, transparent 1px 3px); border-color: var(--ink-4); }
.wkey dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
.wkey .note { grid-column: 1 / -1; color: var(--ink-3); margin-top: 4px; }
:root[data-theme="dark"] .strip .over { opacity: .035; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .strip .over { opacity: .035; } }
.strip .grid.minor { opacity: .55; }
.strip .yl.objective { fill: var(--red); font-weight: 500; }
.strip .now { stroke: var(--ink); stroke-width: 1.5; }
.strip .hair { stroke: var(--ink); stroke-width: 1; opacity: 0; }
.strip .readout { position: absolute; top: calc(100% + 6px); font: 12px var(--sans); font-variant-numeric: tabular-nums; color: var(--ink); background: var(--bg); padding: 0 4px; white-space: nowrap; transform: translateX(-50%); opacity: 0; transition: opacity .15s; pointer-events: none; }
.strip.scrub .readout { opacity: 1; }
.strip.scrub + .axis { opacity: 0; }
.axis { display: flex; justify-content: space-between; font: 11.5px var(--sans); font-variant-numeric: tabular-nums; color: var(--ink-3); margin-top: 10px; padding-right: 52px; }

/* ---------- stories ---------- */
.stories { display: grid; }
.story { padding: 16px 0; transition: opacity .15s; }
.stories.hl .story:not(.on) { opacity: .4 !important; } /* beats the entry animation's inline opacity */
.story.on .when .dot { background: var(--ink); }
.story.alert.on .when .dot { background: var(--red); outline: 1px solid var(--red); outline-offset: 2px; }
.story:focus-visible { outline: 1px dotted var(--ink-3); outline-offset: 4px; }
.story + .story { border-top: 1px dotted var(--rule); }
.story:first-child { padding-top: 2px; } .story:last-child { padding-bottom: 0; }
.story .when { font: 12px/18px var(--mono); color: var(--ink-3); display: flex; gap: 8px; align-items: flex-start; }
.story .when .wt { flex: 1; min-width: 0; } /* wraps between words, never inside one */
.story .when .wt > span { white-space: nowrap; }
.story .when .dot { flex: none; width: 6px; height: 6px; margin-top: 6px; background: var(--ink-4); }
.story.alert .when .dot { background: var(--red); }
.story h3 { font: 600 16.5px/1.35 var(--sans); margin: 6px 0 4px; letter-spacing: -0.01em; }
/* A title's parts: the words between a step quieter; who acted (or which rule) underlined
   dotted, as the page rules its frames; the knob as code; its value with even digits. */
.story h3 .t-w { color: var(--ink-2); font-weight: 500; }
.story h3 .t-actor, .story h3 .t-rule { text-decoration: underline dotted var(--ink-3); text-underline-offset: 3px; text-decoration-thickness: 1px; }
.story h3 .t-knob { font: 500 0.93em var(--mono); letter-spacing: 0; }
.story h3 .t-value { font-variant-numeric: tabular-nums; }
.story p { margin: 0; color: var(--ink-2); }
.story .actions { display: flex; gap: 8px; margin-top: 14px; }
.btn { min-height: 38px; padding: 0 14px; border: 1px solid var(--ink); font-weight: 500; font-size: 14px; transition: transform .16s var(--ease-out), background .2s, color .2s; }
.btn.ink { background: var(--hair); color: var(--ink); border-color: var(--ink-2); } /* the main action: an ink edge, not a block of ink */
@media (hover: hover) and (pointer: fine) { .btn.ink:not(:disabled):hover { border-color: var(--ink); } }
.btn.quiet { border-color: transparent; color: var(--ink-2); padding: 0 8px; }
@media (hover: hover) and (pointer: fine) { .btn:not(.ink):not(:disabled):hover { background: var(--hair); } }
.btn:disabled { opacity: .35; cursor: default; }
.pressed { transform: scale(.97); }
.empty { color: var(--ink-3); font-size: 14px; }

/* ---------- knobs list ---------- */
.list { display: block; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 13px 20px; min-height: 58px; transition: background .15s; }
.row + .row { border-top: 1px dotted var(--rule); }
@media (hover: hover) and (pointer: fine) { .row:hover { background: var(--hair); } }
.row.pressed { transform: none; background: var(--hair); }
.row .name { font-weight: 550; }
.row .meta { font: 11.5px var(--mono); color: var(--ink-3); }
.row .meta.live { color: var(--ink-2); }
.row .val { margin-left: auto; font: 400 18px/1 var(--mono); letter-spacing: -0.02em; }
.row .val small { font: 11.5px var(--mono); color: var(--ink-3); margin-left: 4px; letter-spacing: 0; }
.row .chev { color: var(--ink-3); font: 13px var(--mono); margin-left: 2px; }
.fleet { display: flex; align-items: center; gap: 14px; }
.dots { display: flex; gap: 5px; }
.dots i { width: 9px; height: 9px; border: 1px solid var(--ink-3); transition: background .3s, border-color .3s; }
.dots i.hot { background: var(--red); border-color: var(--red); }
.dots i.me { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--ink-3); } /* the member this page is */
.dots i.gone { border-style: dashed; opacity: .55; } /* suspect or dead: not heard from */
.demo { margin-top: 28px; font: 12px var(--mono); color: var(--ink-3); }
.demo button { text-decoration: underline; text-underline-offset: 3px; color: var(--ink-2); }

/* ---------- sheet ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 70%, transparent); opacity: 0; pointer-events: none; transition: opacity .3s var(--ease-out); }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; margin: 0 auto; width: min(480px, 100%);
  background: var(--bg); border: 1px solid var(--rule); border-bottom: 0; border-radius: 12px 12px 0 0;
  padding: 6px 24px calc(22px + env(safe-area-inset-bottom)); max-height: 92dvh; overflow: auto; overscroll-behavior: contain;
  transform: translateY(110%);
}
@media (min-width: 700px) { .sheet { bottom: auto; top: 50%; border-radius: 0; border-bottom: 1px solid var(--rule); padding-bottom: 24px; transform: translateY(-50%) scale(.98); opacity: 0; pointer-events: none; } .sheet.on { pointer-events: auto; } }
@media (min-width: 700px) { .sheet.wide { width: min(680px, 100%); } }
/* A sheet that scrolls shows its scrollbar always, not only while scrolling: Chrome and Safari honour the
   pseudo-elements only when scrollbar-width is unset, so that is kept for the rest. */
.sheet::-webkit-scrollbar { width: 8px; } .sheet::-webkit-scrollbar-thumb { background: var(--ink-4); border-radius: 4px; }
@supports not selector(::-webkit-scrollbar) { .sheet { scrollbar-width: thin; scrollbar-color: var(--ink-4) transparent; } }
.sheet.more::after { content: ""; position: sticky; display: block; bottom: -24px; height: 36px; margin: -36px -24px -24px; pointer-events: none;
  background: linear-gradient(to bottom, transparent, var(--bg)); }
/* the instance sheet: names and values in two columns; what each means only when asked */
.facts .see { font: inherit; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
.isheet .sh { font: 12px var(--mono); letter-spacing: .06em; color: var(--ink-3); margin: 18px 0 2px; } .isheet .sh span { letter-spacing: 0; }
/* The open dock: one grid, so every row shares its edges: a glyph gutter (! sick, × silent) the eye runs down,
   the member's name, then what is wrong with it; the rest below in the same columns, quieter. One column of
   reading, left-aligned with the strip's text, never spread across a wide screen. */
.fs { font-family: var(--sans); }
/* Tiles: the areas share their edges (each draws its frame and overlaps the next by 1 px, so a shared edge is one
   dotted line), the title set into the top rule, "+" at the corners: the page's own frame, tiled. */
.fsw { display: grid; grid-template-columns: minmax(0, 1fr); align-items: stretch; padding: 14px 4px 4px; }
@media (min-width: 1100px) { .fsw:not(.one) { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); } }
.fsw .tile { position: relative; border: 1px dotted var(--rule); margin: 0 -1px -1px 0; padding: 30px 26px 22px; min-width: 0; }
.fsw .tile > .c { position: absolute; font: 12px/1 var(--mono); color: var(--ink-3); background: var(--bg); pointer-events: none; z-index: 1; }
.fsw .tile > .c.tl { top: -7px; left: -4px; } .fsw .tile > .c.tr { top: -7px; right: -4px; } .fsw .tile > .c.bl { bottom: -6px; left: -4px; } .fsw .tile > .c.br { bottom: -6px; right: -4px; }
.fsw .tile > .label { position: absolute; top: -10px; left: 24px; background: var(--bg); padding: 0 8px; font: 600 12.5px/18px var(--mono); letter-spacing: .08em; color: var(--ink); white-space: nowrap; z-index: 1; }
.fsw .tile > .label span { font-weight: 400; color: var(--ink-3); letter-spacing: 0; }
.fsw .tile.hot > .label { color: var(--red); } /* what needs attention: the one red title */
@media (min-width: 761px) { /* beside what needs attention, a healthy one's last change matters least */
  .fsw .tile.rest .tbh, .fsw .tile.rest .tbr { grid-template-columns: 60px 100px 72px minmax(0, 1fr); }
  .fsw .tile.rest .tbh span:nth-child(5), .fsw .tile.rest .tbr span:nth-child(5) { display: none; }
}
.fsg { display: grid; grid-template-columns: 16px 84px minmax(0, 1fr); column-gap: 16px; align-items: baseline; }
.fsg .g { font: 600 16px var(--mono); font-style: normal; color: var(--red); text-align: center; }
.fsg .nm { font: 500 16px var(--mono); display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
.fsg .nm small { font: 12px var(--sans); color: var(--ink-3); }
.fsg .n { font: inherit; padding: 0; text-align: left; color: var(--ink); text-decoration: underline dotted var(--ink-4); text-underline-offset: 4px; }
.fsg .c { min-width: 0; padding-bottom: 28px; }
.fsg > .c:last-child { padding-bottom: 0; }

   FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE
   LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING
   FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE SOFTWARE.
   The strip is the FLEET fact, always there: one tap or a drag opens the panel; its state is a glyph ("!" before
   the number, "×" for a member not heard from) and the number's ink, and the frame's title turns red while the
   fleet is over its objective. Open, it is two thirds of the window over the page, which dims and blurs and
   takes no input; a splitter sets the height (remembered). A member's sheet opens in its place, Esc the way
   back. On a phone it is a sheet with three detents. */
.dock { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; height: var(--dock-h, 44px); background: var(--bg); flex-direction: column; transition: height .25s var(--ease-out); font: 14px/21px var(--mono); letter-spacing: .02em; font-variant-numeric: tabular-nums; }

.dockscrim { position: fixed; left: 0; right: 0; top: 0; bottom: var(--dock-h, 44px); z-index: 29; background: var(--bg); opacity: 0; pointer-events: none; transition: opacity .25s var(--ease-out), bottom .25s var(--ease-out); }
body.docked.dockopen .dockscrim { opacity: .82; pointer-events: auto; cursor: pointer; }
@supports (backdrop-filter: blur(1px)) { .dockscrim { background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(0px) grayscale(0); -webkit-backdrop-filter: blur(0px) grayscale(0); transition: opacity .25s var(--ease-out), backdrop-filter .25s var(--ease-out), bottom .25s var(--ease-out); }
  body.docked.dockopen .dockscrim { opacity: 1; backdrop-filter: blur(5px) grayscale(.6); -webkit-backdrop-filter: blur(5px) grayscale(.6); } } /* the eye goes to the open panel; a click on the page closes it */
@media (prefers-reduced-motion: reduce) { .dockscrim { transition: none; } }
.dock.dragging, body.dragging, body.still .dock, body.still .dockscrim { transition: none !important; }
.dock::before { content: ""; position: absolute; left: 0; right: 0; top: -32px; height: 32px; background: linear-gradient(to bottom, transparent, var(--bg)); pointer-events: none; } /* the page fades out above the edge */
.dock { --page-w: 1120px; } @media (min-width: 1320px) { .dock { --page-w: 1560px; } }
.dock .rule { position: absolute; left: 0; right: 0; top: 0; height: 1px; background: repeating-linear-gradient(90deg, var(--rule) 0 2px, transparent 2px 7px); }
.dock .rule .c { position: absolute; top: -6px; font: 12px/1 var(--mono); letter-spacing: 0; color: var(--ink-3); background: var(--bg); }
.dock .rule .c.l { left: max(-4px, calc((100% - var(--page-w)) / 2 - 4px)); } .dock .rule .c.r { right: max(-4px, calc((100% - var(--page-w)) / 2 - 4px)); }
.dock .rule .title { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); background: var(--bg); padding: 0 8px; font: 12px/18px var(--mono); letter-spacing: .06em; color: var(--ink-3); white-space: nowrap; }
.dock.over .rule .title { color: var(--red); } /* the fleet is over its objective */
.dock .split { flex: none; position: relative; z-index: 1; height: 9px; margin: -5px 0 -4px; cursor: row-resize; touch-action: none; }
.dock .split:focus-visible { outline: none; box-shadow: inset 0 2px var(--ink-3); }
/* The strip's text starts where the page's does, at any window width. */
.dock .strip, .dock .body { padding-left: max(24px, calc((100% - var(--page-w)) / 2 + 24px)); padding-right: max(24px, calc((100% - var(--page-w)) / 2 + 24px)); }
.dock .strip { flex: none; position: relative; display: flex; align-items: stretch; gap: 24px; height: 44px; color: var(--ink-2); cursor: default; touch-action: auto; } /* not the chart's .strip */
.dock .fact { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; text-align: left; font: inherit; color: inherit; white-space: nowrap; touch-action: none; }
.dock .fact:focus, .dock .fact:focus-visible { outline: none; } /* never a box: the strip is the panel's edge */
.dock .fact:focus-visible .txt { text-decoration: underline dotted var(--ink-3); text-underline-offset: 5px; }
.dock .fact { cursor: pointer; } @media (hover: hover) and (pointer: fine) { .dock .fact:hover .txt { color: var(--ink); } }
.dock .fact .marks { letter-spacing: .12em; color: var(--ink-3); }
.dock .fact .marks .b { color: var(--ink); } /* ■ stands out, × not heard from */
.dock .fact .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.dock .fact .bang, .dock .fact .num { font-weight: 600; color: var(--ink); }
.dock .fact .num.hot { color: var(--red); } /* the only red: the fleet over its objective */
.dock .body { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; padding-top: 18px; padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
.dock .body.enter > * { animation: fadeup .22s var(--ease-out); } /* once, when the panel opens; never on a live refresh */
@keyframes fadeup { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .dock .body.enter > * { animation: none; } }

.dock .body::-webkit-scrollbar { width: 8px; } .dock .body::-webkit-scrollbar-thumb { background: var(--ink-4); border-radius: 4px; }
@supports not selector(::-webkit-scrollbar) { .dock .body { scrollbar-width: thin; scrollbar-color: var(--ink-4) transparent; } }

@media (min-width: 700px) {
  body.docked { padding-bottom: 68px; } /* the strip's height and some air: the open panel lies over the page, it doesn't reflow it */
}

.roll .ch { display: inline-block; position: relative; overflow: hidden; height: 1.08em; line-height: 1.08em; }
.roll .ch > span { display: block; }
.roll .ch > span.out { position: absolute; left: 0; top: 0; }
/* the layer stack: default, fleet, agent, rule, pin; the one in effect filled */
.stk { display: inline-flex; gap: 2px; vertical-align: 1px; margin-right: 7px; }
.stk i { width: 5px; height: 5px; border: 1px solid var(--ink-4); }
.stk i.has { border-color: var(--ink-3); }
.stk i.win { background: var(--ink); border-color: var(--ink); }
.lease { display: block; height: 1px; background: var(--hair); margin-top: 6px; width: 120px; }
.lease i { display: block; height: 1px; background: var(--ink-2); }
/* rules, honest */
.rules .rule .st { font: 12px var(--mono); color: var(--ink-2); grid-column: 1 / -1; }
.rules .rule .meta { grid-column: 1 / -1 !important; }
.rules .rule button[data-r] { grid-row: 1 !important; }
.rules .rule button.see { all: unset; cursor: pointer; font: 12px var(--mono); color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }
.row .val { white-space: nowrap; }
.rules .rule .st b { font-weight: 400; color: var(--ink); }
.rules .rule.stopped .st b, .rules .rule.error .st b { color: var(--red); }
.rules .rule.disabled .st b { color: var(--ink-3); }
.rules .rule .meta { color: var(--ink-3) !important; }
.rules .rule .warn code { font: 12px var(--mono); color: var(--ink); }
/* stories, said once */
.story .swhy { margin: 0; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fx { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 10px; font: 12.5px var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.fx .k { color: var(--ink-3); margin-right: 6px; }
.fx .d { margin-left: 6px; }
.fx .d.worse { color: var(--red); }
.fx .d.better { color: var(--ink); }
.fx .conf { color: var(--ink-3); }
.story .more { font: 12px var(--mono); color: var(--ink-3); margin-top: 8px; text-decoration: underline; text-underline-offset: 3px; }
.story .detail { display: none; margin: 8px 0 0; color: var(--ink-3); font-size: 14px; }
.story.open .detail { display: block; }
/* routes: many endpoints */
.routes { display: grid; }
.rt { display: grid; grid-template-columns: 1fr 96px 64px 56px; gap: 14px; align-items: center; width: 100%; text-align: left; padding: 9px 20px; font-size: 14px; transition: background .15s; }
.rt + .rt { border-top: 1px dotted var(--rule); }
.rt .rn { font: 13px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rt .rn i { font-style: normal; color: var(--ink-3); margin-right: 6px; }
.rt .sp { height: 18px; width: 96px; }
.rt .sp polyline { fill: none; stroke: var(--ink-3); stroke-width: 1; }
.rt.hot .sp polyline { stroke: var(--red); stroke-width: 1.75; }
.rt .sp line { stroke: var(--red); stroke-dasharray: 4 2; }
.rt .v { font: 13px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.rt.hot .v { color: var(--red); }
.rt .q { font: 11.5px var(--mono); color: var(--ink-3); text-align: right; }
.rt.on { background: var(--hair); }
.rt.on .rn { font-weight: 600; }
@media (hover: hover) and (pointer: fine) { .rt:hover { background: var(--hair); } }
.rthead { display: grid; grid-template-columns: 1fr 96px 64px 56px; gap: 14px; padding: 4px 20px 8px; font: 10.5px var(--mono); letter-spacing: .06em; color: var(--ink-3); }
.rthead span:nth-child(n+3) { text-align: right; }
.rtmore { padding: 10px 20px 2px; font: 12px var(--mono); color: var(--ink-3); }
.rtmore button { text-decoration: underline; text-underline-offset: 3px; color: var(--ink-2); }
@media (max-width: 600px) { .rt, .rthead { grid-template-columns: 1fr 56px 52px; padding-left: 16px; padding-right: 16px; } .rt .sp, .rthead span:nth-child(2) { display: none; } }
/* preview switcher (fixtures only) */
.pv { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 7px max(24px, env(safe-area-inset-right)) 7px max(24px, env(safe-area-inset-left)); font: 11.5px var(--mono); color: var(--ink-3); border-bottom: 1px dotted var(--rule); }
.pv a { color: var(--ink-2); text-decoration: none; } .pv a.on { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.btn, .row, .rt, .rules .rule button, .freeze, .lever { transition: transform .12s var(--ease-out), background .15s, color .15s, border-color .15s; }
.pressed, .rt.pressed, .rules .rule button.pressed { transform: scale(.97); }
.row.pressed { transform: scale(.985); }

/* Section labels, one weight wherever they head a group (RUNTIME, NEEDS ATTENTION, THE REST, WHO HOLDS IT, BEFORE
   YOU CHANGE IT, the keys): full ink and semibold, so a group's start is found before its contents; what trails
   a label (". Go and the container, last 10 s") stays quiet. Frame titles, row labels and column heads are not

.keys h4, .isheet .sh, .stack .h, .history .h, .plan .h, .sigs .sh, .notes .sh { font: 600 12.5px var(--mono); letter-spacing: .08em; color: var(--ink); }
.isheet .sh span, .sigs .sh span, .notes .sh span { font-weight: 400; color: var(--ink-3); letter-spacing: 0; }

<script type="module">
/* The live control UI. Everything comes from the instance's /api, polled; nothing is simulated.
   Changes made here are the configured person's pins, planned with /api/preview first. */

/* ---------------- motion ---------------- */
let M = null;
try { M = await import("https://cdn.jsdelivr.net/npm/motion@14.9.0/+esm"); } catch {}
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (M) return M.animate(el, kf, { type: M.spring, bounce: o.bounce ?? 0.18, visualDuration: o.d ?? 0.4, delay: o.delay ?? 0 });

    const t0 = performance.now();
    const step = now => { const t = Math.min(1, (now - t0) / ms); fn(ease(t)); t < 1 ? requestAnimationFrame(step) : res(); };
    requestAnimationFrame(step);
  });
}
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
document.addEventListener("pointerdown", e => {
  const b = e.target.closest(".btn, .row"); if (!b) return;
  b.classList.add("pressed");
  const up = () => { b.classList.remove("pressed"); removeEventListener("pointerup", up); removeEventListener("pointercancel", up); };
  addEventListener("pointerup", up); addEventListener("pointercancel", up);
});

/* ---------------- values ---------------- */
// Durations come as Go strings ("1m30s", "500ms"); the dial works in milliseconds.
function durMs(s) {
  if (typeof s === "number") return s;
  let ms = 0; const re = /([\d.]+)(h|ms|µs|us|ns|m|s)/g; let m;
  while ((m = re.exec(s))) ms += +m[1] * { h: 3600e3, m: 60e3, s: 1e3, ms: 1, "µs": 1e-3, us: 1e-3, ns: 1e-6 }[m[2]];
  return ms;
}
const durText = ms => ms >= 1000 ? `${+(ms / 1000).toFixed(ms % 1000 ? 2 : 0)}s` : `${+ms.toFixed(ms < 10 ? 2 : 0)}ms`;
// Log levels come as slog's names ("INFO", "DEBUG-4"); the dial works in slog's numbers.
const LV = { TRACE: -8, DEBUG: -4, INFO: 0, WARN: 4, ERROR: 8 }; // TRACE is DEBUG-4, which slog leaves unnamed
const lvNum = s => { if (typeof s === "number") return s; const m = /^([A-Z]+)([+-]\d+)?$/.exec(String(s).toUpperCase()); return m && m[1] in LV ? LV[m[1]] + (+m[2] || 0) : 0; };
const lvText = n => { const b = n <= -8 ? "TRACE" : n < 0 ? "DEBUG" : n < 4 ? "INFO" : n < 8 ? "WARN" : "ERROR", o = n - LV[b]; return o ? `${b}${o > 0 ? "+" : ""}${o}` : b; };
const numOf = (k, v) => k.type === "duration" ? durMs(v) : k.type === "level" ? lvNum(v) : v;
const show = (k, v) => k.special && v === k.special ? v : k.type === "duration" ? durText(numOf(k, v)) : k.type === "level" ? lvText(numOf(k, v)) : typeof v === "number" ? v.toLocaleString() : v;
// a value as people read it: with its unit, "16 items", "5ms"
const withUnit = (k, v) => k && k.unit ? `${show(k, v)} ${k.unit}` : k ? show(k, v) : v;
const times = (a, b) => { const r = a / b; return r >= 1.5 ? (r < 2.5 ? "about twice" : `${r > 10 ? "more than" : "nearly"} ${Math.round(r)} times`) : "above"; };
const sentence = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const clock = t => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const ago = t => { const s = Math.round((Date.now() - t) / 1000); return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)} min ago` : clock(t); };

/* ---------------- data ---------------- */
let D = null, lastOK = 0, polling = null, streaming = false;
// Another member, viewed and acted on through this page (?instance=, forwarded over the ring); null is this one.
let viewing = null, home = null, es = null;
// Preview: ?state=<fixture> renders a saved /api/state from ui/fixtures (served by any static server, not by
// the instance), for screenshots; time is the fixture's own, and nothing is written.
const Q = new URLSearchParams(location.search), FIX = Q.get("state");
if (Q.get("theme")) document.documentElement.dataset.theme = Q.get("theme");
let FIXD = null, tick = 0;
if (FIX) {
  FIXD = await (await fetch(`fixtures/${FIX}.json`)).json();
  const realNow = Date.now.bind(Date), t0 = realNow(), at = Date.parse(FIXD.now);
  Date.now = () => at + (realNow() - t0);
  const pv = document.createElement("div"); pv.className = "pv";
  const link = (k, v, label) => { const q = new URLSearchParams(location.search); q.set(k, v); return `<a href="?${q}" class="${(Q.get(k) || ({ theme: "auto" }[k] || "")) === v ? "on" : ""}">${label ?? v}</a>`; };
  pv.innerHTML = `PREVIEW ${["bare", "calm", "breach", "recovering", "stopped", "frozen", "squeezed", "routes", "fleet", "rollout"].map(s => link("state", s)).join(" ")} · ${["auto", "light", "dark"].map(t => link("theme", t)).join(" ")}`;
  document.querySelector("main").before(pv);
}
async function api(path, body) {
  if (FIX) {
    if (path === "/api/state") { // a little movement, so rolling values can be seen
      const d = structuredClone(FIXD), w = 1 + Math.sin(++tick * 1.7) * .03;
      for (const r of d.routes) if (r.now?.p99_ms != null && tick > 1) r.now.p99_ms *= w;
      return d;
    }
    if (path === "/api/preview") { const [k, v] = Object.entries(body.set)[0]; return { effects: [{ knob: k, layer: "pin", value: v }] }; }
    throw new Error("Preview: nothing changes here.");
  }
  if (viewing) path += `${path.includes("?") ? "&" : "?"}instance=${encodeURIComponent(viewing)}`;
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
async function poll() {
  try {
    D = await api("/api/state"); lastOK = Date.now();
    render();
  } catch (e) { $("#status").classList.add("stale"); $("#status").firstChild.textContent = `can't reach the instance: ${e.message}`; }
}
// A member's instance sheet: this page's own from what it has, another's asked for through this one.
async function showMember(name) {
  const inDock = dockOpen(); // from the fleet panel: the member's sheet takes its place there
  if (D.fleet.members.find(m => m.self)?.name === name) return showInstance(false, D, inDock);
  if (FIX) return toast("Preview: no other members to ask here.");
  try {
    const r = await fetch(`/api/state?instance=${encodeURIComponent(name)}`), st = await r.json();
    if (!r.ok) throw new Error(st.error || r.statusText);
    showInstance(false, st, inDock);
  } catch (e) { toast(`${name}: ${e.message}`); }
}
// Open a member: the whole page becomes that member's, polled through this one, and acting here acts there,
// as this page's person. Opening this page's own member goes back to the stream.
function view(name) {
  if (FIX) return toast("Preview: there are no other members here.");
  home ||= D.fleet?.members.find(m => m.self)?.name;
  viewing = name === home ? null : name;
  es?.close(); es = null; clearInterval(polling); polling = null; streaming = false; D = null;
  document.body.classList.toggle("viewing", !!viewing);
  $("#viewTxt").innerHTML = viewing ? `Viewing <b>${esc(viewing)}</b> from ${esc(home)}. What you change here, you change on ${esc(viewing)}.` : "";
  $("#viewBack").textContent = `Back to ${home}`;
  if (viewing) { mode = `viewing ${viewing}`; poll(); polling = setInterval(poll, 2000); } else { mode = "live"; connect(); }
}
$("#viewBack").onclick = () => view(home);
// After an action: the stream brings the change within 50 ms; without one, fetch it.
const refresh = () => streaming ? Promise.resolve() : poll();
// A stream event carries every route's newest buckets only (all of them on connect): put them in place by start.
function merge(next) {
  if (!D) return next;
  const old = Object.fromEntries((D.routes || []).map(r => [r.route, r.history || []]));
  for (const r of next.routes || []) {
    const byStart = new Map((old[r.route] || []).map(b => [b.start, b]));
    for (const b of r.history || []) byStart.set(b.start, b);
    r.history = [...byStart.values()].sort((a, b) => a.start < b.start ? -1 : 1).slice(-N);
  }
  return next;
}
// The stream (GET /api/events); if it can't connect three times running (a proxy that won't stream), poll.
function connect() {
  es = new EventSource("/api/events");
  let opened = false, fails = 0;
  es.addEventListener("state", e => {
    opened = streaming = true; fails = 0;
    D = merge(JSON.parse(e.data)); lastOK = Date.now();
    try { render(); } catch (err) { // say so, rather than look like it never connected
      console.error(err);
      $("#status").firstChild.textContent = "the page failed to draw this state: " + err.message;
    }

    streaming = false;
    if (!opened && ++fails >= 3) {

    }

}
let mode = "live";
// The strip shows one route: the one picked, else the one furthest over its SLO, else the busiest.
let pickedRoute = null;
const sloOf = r => r?.slo_ms || 0;
const strain = r => sloOf(r) && r.now?.p99_ms != null ? r.now.p99_ms / sloOf(r) : 0;
function rankedRoutes() {
  return [...(D?.routes || [])].sort((a, b) => (strain(b) > 1) - (strain(a) > 1) || strain(b) - strain(a) || (b.now?.requests || 0) - (a.now?.requests || 0));
}
const route = () => D?.routes?.find(r => r.route === pickedRoute) || rankedRoutes()[0];
// Why the chart shows this route: you picked it, it's over its SLO, or, with no
// SLO to rank by, it's the busiest (or the only one). A route within its SLO
// needs no reason: its SLO line is on the chart.
function routeWhy(r) {
  if (!r) return "";
  if (r.route === pickedRoute) return "picked";
  if (strain(r) > 1) return "over its SLO";
  if (sloOf(r)) return "";
  return (D.routes || []).length > 1 ? "busiest" : "only route";
}
const slo = () => route()?.slo_ms || D?.slo?.p99_ms || 0;
// Nothing declared yet: vis is wired (vis.Start, the middleware) and only measures. The page says what it
// sees and the next step, instead of judging against objectives that don't exist.
// The first minute after a start isn't a verdict: caches, connections and models are still loading,
// so the first requests are slow in any service. The page shows them, and judges the SLO after.
const WARM = 60e3;
const warming = () => !!D.started && Date.now() - Date.parse(D.started) < WARM;
const noObjectives = () => !(D.slos || []).length && !(D.routes || []).some(sloOf);

/* ---------------- headline ---------------- */
let lastHead = "";
function problems() {
  const r = route(), rt = D.runtime, out = [];
  // A route whose last 10 s are back within its SLO is recovering: its minute still holds the slow requests
  // from before, and says so for up to 70 s more, but whoever fixed it shouldn't read that as still broken.
  const over = warming() ? [] : (D.routes || []).filter(x => strain(x) > 1), mending = over.filter(x => overRun(x).recovering != null);
  const hot = over.filter(x => !mending.includes(x));
  if (hot.length === 1 && D.routes.length > 1) out.push({ sev: 3, alert: true, h: `${hot[0].route} is over its SLO.` });
  else if (hot.length > 1) out.push({ sev: 3, alert: true, h: `${hot.length} routes are over their SLO.` });

function renderRoutes() {

  box.querySelectorAll(".rt").forEach(b => b.onclick = () => { pickedRoute = b.dataset.route === rankedRoutes()[0].route ? null : b.dataset.route; render(); });

    box.className = "plan" + (e.layer !== "pin" ? " blocked" : "");
    box.innerHTML = e.layer !== "pin"
      ? `<div class="h">PLAN</div>Won't take effect: <b>the ${e.layer} layer holds ${k.name} at ${esc(show(k, e.value))}</b>.`
      : `<div class="h">PLAN</div><b>${esc(k.name)} ${esc(show(k, cur))} → ${esc(show(k, e.value))}${k.unit ? " " + esc(k.unit) : ""}</b> as your pin${lease === "No end" ? "" : ` for ${lease}`}.${over}${then}${restart}`;
    const call = `set_knob ${JSON.stringify(body())}`;
    box.insertAdjacentHTML("beforeend", `<div class="cmd"><code>${esc(call)}</code><button class="copy" data-call="${encodeURIComponent(call)}">copy</button></div>`);
    btn.disabled = e.layer !== "pin"; btn.dataset.kbd = `${MOD}↵`;
    btn.textContent = `Pin ${show(k, e.value)}${k.unit ? " " + k.unit : ""}${lease === "No end" ? "" : ` for ${lease}`}${keep === "Kept" ? ", kept" : ""}`;
  };
  let planT; const replan = () => { clearTimeout(planT); planT = setTimeout(plan, 120); setBig(val); was.textContent = val !== cur ? `was ${show(k, cur)}` : ""; };
  box.addEventListener("click", e => { const b = e.target.closest("[data-call]"); if (b) copyText(decodeURIComponent(b.dataset.call), b); });
  const settle = () => { const from = shown, to = fracOf(val); tween(320, t => { shown = from + (to - from) * t; paint(shown); }); };
  paint(shown); plan();
  const detent = i => { navigator.vibrate?.(4); const t = tickEls[i]; if (t) spring(t, { strokeWidth: ["3.5", "1.5"] }, { d: .25, bounce: 0 }); };
  let drag = null;
  enc.addEventListener("pointerdown", ev => {
    enc.setPointerCapture(ev.pointerId); enc.classList.add("turning");
    const r = enc.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    drag = { cx, cy, f: shown, a: Math.atan2(ev.clientY - cy, ev.clientX - cx), y: ev.clientY, ring: Math.hypot(ev.clientX - cx, ev.clientY - cy) > r.width * 0.3 };
  });
  enc.addEventListener("pointermove", ev => {
    if (!drag) return;
    const a = Math.atan2(ev.clientY - drag.cy, ev.clientX - drag.cx);
    let da = a - drag.a; drag.a = a;
    if (da > Math.PI) da -= 2 * Math.PI; if (da < -Math.PI) da += 2 * Math.PI;
    drag.acc = (drag.acc || 0) + da;
    shown = clamp(drag.f + (drag.ring ? drag.acc / ((A1 - A0) * Math.PI / 180) : (drag.y - ev.clientY) / 260), 0, 1);
    paint(shown);
    const v = fromFrac(shown); if (v !== val) { val = v; replan(); }
    const d = Math.round(shown * n); if (d !== lastDetent) { lastDetent = d; detent(d); }
  });
  const end = () => { if (!drag) return; drag = null; enc.classList.remove("turning"); settle(); };
  enc.addEventListener("pointerup", end); enc.addEventListener("pointercancel", end);
  enc.addEventListener("keydown", ev => {
    const d = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1, PageUp: 10, PageDown: -10 }[ev.key] * (ev.shiftKey && ev.key.startsWith("Arrow") ? 10 : 1);
    let f;
    if (ev.key === "Home") f = 0; else if (ev.key === "End") f = 1;
    else if (d && k.type === "level") f = toFrac(clamp(val + Math.sign(d) * 4, lo, hi)); // one level per press
    else if (d) f = clamp(fracOf(val) + d / n, 0, 1); else return;
    // On a log dial a tick near its low end is less than one value (cache_size from 1: ×1.17 rounds back to 1), and
    // the arrows went nowhere: a step that lands where it started moves to the next value instead.
    const was = val; val = fromFrac(f);
    if (val === was && d && k.type !== "level") val = clamp(was + Math.sign(d) * stAt(was), lo, hi);
    ev.preventDefault(); replan(); settle(); detent(Math.round(fracOf(val) * n));
  });
  document.querySelectorAll("#sheetBody .seg").forEach(sg => {
    const ind = sg.querySelector(".ind"), opts = [...sg.querySelectorAll("button")];
    const place = () => { const on = sg.querySelector("button.on"); ind.style.width = `${on.offsetWidth}px`; ind.style.transform = `translateX(${on.offsetLeft}px)`; };
    requestAnimationFrame(place);
    sg.addEventListener("keydown", ev => { const d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[ev.key]; if (!d) return; ev.preventDefault(); const i = (opts.findIndex(o => o.classList.contains("on")) + d + opts.length) % opts.length; opts[i].click(); opts[i].focus(); });
    opts.forEach(b => b.onclick = () => { opts.forEach(o => { o.classList.toggle("on", o === b); o.setAttribute("aria-checked", String(o === b)); o.tabIndex = o === b ? 0 : -1; }); place(); if (sg.dataset.seg === "keep") keep = b.dataset.o; else lease = b.dataset.o; plan(); });
  });
  $("#spBtn")?.addEventListener("click", () => { val = SP; replan(); settle(); });
  if (hint.reason) $("#reason").value = hint.reason; // from the facts: why you're here
  $("#reason").addEventListener("input", replan);
  btn.onclick = async () => {
    btn.disabled = true;
    try {
      const rec = await api("/api/apply", body());
      const e = rec.effects[0];
      closeSheet(); await refresh();
      toast(`${k.name} is now ${show(k, e.value)}.`, "Undo", async () => {
        try { rec.lease ? await api("/api/revert", { lease: rec.lease, reason: "undone from the UI" }) : await api("/api/clear", { knob: k.name, reason: "undone from the UI" }); refresh(); }
        catch (err) { toast(err.message); }
      });
    } catch (err) { btn.disabled = false; box.className = "plan blocked"; box.innerHTML = `<div class="h">PLAN</div>${esc(err.message)}`; }
  };
  const un = $("#unpinBtn");
  if (un) un.onclick = async () => {
    try { const e = await api("/api/clear", { knob: k.name, reason: $("#reason").value.trim() || "pin removed from the UI" }); closeSheet(); await refresh(); toast(`Pin removed. ${k.name} is ${show(k, e.value)}.`); }
    catch (err) { toast(err.message); }
  };
}

/* ---------------- toast ---------------- */
let toastT;
function toast(msg, action, fn) {
  const t = $("#toast"); t.innerHTML = esc(msg) + (action ? `<button>${action}</button>` : "");
  const hide = () => spring(t, { transform: ["translate(-50%, 0%)", "translate(-50%, 200%)"], opacity: [1, 0] }, { d: .3, bounce: 0 });
  if (action) t.querySelector("button").onclick = () => { fn(); hide(); };
  spring(t, { transform: ["translate(-50%, 200%)", "translate(-50%, 0%)"], opacity: [0, 1] }, { d: .35, bounce: .15 });
  clearTimeout(toastT); toastT = setTimeout(hide, 5000);
}

/* ---------------- freeze ---------------- */
function renderFreeze() {
  const f = D.freeze;
  document.body.classList.toggle("frozen", f.frozen);
  $("#freezeBtn").setAttribute("aria-pressed", String(f.frozen));
  if (!f.frozen) { $("#freezeLbl").textContent = "Freeze"; return; }
  const since = Date.parse(f.since), mins = Math.floor((Date.now() - since) / 60e3);
  $("#freezeLbl").textContent = mins < 1 ? "Frozen" : `Frozen ${mins} min`;
  const reason = [...(D.history || [])].reverse().find(e => e.kind === "freeze" && e.fields?.reason)?.fields.reason || f.reason;
  $("#freezeWho").textContent = `by ${who(f.by)} · since ${clock(since)}${reason ? ` · “${reason}”` : ""}`;
}
async function setFrozen(on, reason = "") {
  try {
    await api(on ? "/api/freeze" : "/api/unfreeze", { reason });
    await refresh();
    toast(on ? "Frozen. Every knob holds its current value." : "Unfrozen. Leases pick up where they stopped.");
    if (on && matchMedia("(pointer: fine)").matches) $("#freezeWhy").focus({ preventScroll: true });
  } catch (e) { toast(e.message); }
}
$("#freezeBtn").onclick = () => setFrozen(!D.freeze.frozen);
$("#unfreezeBtn").onclick = () => setFrozen(false, $("#freezeWhy").value.trim());
$("#freezeWhy").addEventListener("keydown", async e => {
  if (e.key === "Escape") { e.preventDefault(); e.target.blur(); $("#freezeBtn").focus(); }
  if (e.key === "Enter") { e.preventDefault(); const r = e.target.value.trim(); if (r) { await api("/api/freeze", { reason: r }).catch(() => {}); e.target.value = ""; refresh(); toast("Reason added to the freeze."); } e.target.blur(); $("#freezeBtn").focus(); }
});

/* ---------------- keyboard ---------------- */
addEventListener("keydown", e => { if (e.key === "Tab" || e.key.length === 1 || e.key.startsWith("Arrow")) document.body.classList.add("keys-on"); }, true);
addEventListener("pointerdown", () => document.body.classList.remove("keys-on"), true);
const KEYS = [
  ["Anywhere", [["?", "Show these keys"], ["j k", "Next / previous story"], ["1 – 9", "Open a knob"], ["t", "Go to the timeline"], ["r", "The routes"], ["i", "The fleet, or this instance alone"], ["f", "Freeze automated changes"], ["Shift F", "Unfreeze"], ["Esc", "Close"]]],
  ["On a story", [["↵", "Its action (Review)"], ["c", "Copy the story as text"], ["Shift C", "Copy today, oldest first"]]],
  ["On the timeline", [["← →", "Move by 10 s (Shift: 100 s)"], ["[ ]", "Previous / next event"], ["Home End", "Oldest / now"], ["↵", "Open the story at that moment"]]],
  ["On a knob", [["← →", "Turn one step (Shift: ten)"], ["Home End", "Minimum / maximum"], ["Tab", "For how long; arrows choose"], [`${MOD}↵`, "Apply the plan"]]],
];
function showKeys() {
  openSheet(`<h3 id="sheetTitle" tabindex="-1">Keyboard</h3><div class="desc">Everything works without a pointer.</div>
    <div class="keys">${KEYS.map(([h, rows]) => `<section><h4>${h.toUpperCase()}</h4><dl>${rows.map(([k, d]) => `<dt>${k.split(" ").map(x => `<span>${x}</span>`).join("")}</dt><dd>${d}</dd>`).join("")}</dl></section>`).join("")}</div>`);
}
$("#keysBtn").onclick = showKeys;
const sheetOpen = () => sheet.classList.contains("on");
addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && sheetOpen()) { const b = $("#applyBtn"); if (b && !b.disabled) { e.preventDefault(); b.click(); } return; }
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
  if (e.target.closest?.("input, textarea, [contenteditable]")) return;
  if (sheetOpen() || !D) return;
  if (dockOpen() && !["?", "i", "Escape", "Tab"].includes(e.key)) return; // the page under the open dock takes no input
  const story = document.activeElement?.closest?.(".story")?._s;
  const knob = knobOrder[+e.key - 1];
  const act = fn => { e.preventDefault(); fn(); };
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key, shift = e.shiftKey;
  if (e.key === "?") act(showKeys);
  else if (e.key === "j" || (e.key === "ArrowDown" && story)) act(() => moveStory(1));
  else if (e.key === "k" || (e.key === "ArrowUp" && story)) act(() => moveStory(-1));
  else if (knob) act(() => { const r = $(`.row[data-k="${knob.name}"]`); r?.focus(); r?.click(); });
  else if (e.key === "t") act(() => { stripBox.focus(); kbBin ??= B - 1; scrubBin(kbBin); });
  else if (e.key === "r" && !$("#routesFrame").hidden) act(() => $("#routes .rt")?.focus());
  else if (e.key === "i") act(() => { if (fleetOn()) toggleDock(); else { $("#fleetBtn").focus(); $("#fleetBtn").click(); } });
  else if (key === "f" && shift) act(() => setFrozen(false));
  else if (key === "f") act(() => D.freeze.frozen ? $("#freezeWhy").focus() : setFrozen(true));
  else if (key === "c" && shift) act(() => $(".copyall")?.click());
  else if (story && e.key === "Enter" && e.target.classList.contains("story")) act(() => story.actions?.[0]?.fn());
  else if (story && e.key === "c") act(() => storyEl(story)?.querySelector(".copy").click());
});

/* ---------------- main loop ---------------- */
document.querySelectorAll(".frame").forEach(f => ["tl", "tr", "bl", "br"].forEach(c => { const e = document.createElement("span"); e.className = "c " + c; e.textContent = "+"; f.appendChild(e); }));
document.body.classList.add("still"); // the first paint draws the page as it is: nothing slides or fades in
function render() {
  if (!render.done) { render.done = true; requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove("still"))); }
  document.title = `${D.service} · vis`; $("#svcName").textContent = D.service;
  const why = routeWhy(route());
  $("#stripLabel").textContent = route() ? `P99 · ${route().route}${why ? ` · ${why}` : ""}` : "P99";
  const st = $("#status"); st.classList.remove("stale");
  st.firstChild.textContent = `${FIX ? `preview of ${FIX}` : mode} · build ${String(D.build).slice(0, 7)} · as ${D.user}`;
  headline(); renderScope(); renderFig(); renderMem(); renderRoutes(); renderStories(); drawStrip(); renderKnobs(); renderRules(); renderInstance(); renderFreeze();
  renderDock();
  if (scrubX != null) scrub({ clientX: scrubX }); else if (kbBin != null) scrubBin(kbBin);
}
if (FIX) { // ?sheet=fleet (or =instance) opens that sheet once the fixture is drawn, for a link to it
  const dq = Q.get("dock"); if (dq) DK.detent = dq === "full" ? 2 : 1;
  poll().then(() => { if ((Q.get("sheet") === "fleet" || (dq && dq !== "peek")) && fleetOn()) { openDock(); if (Q.get("member")) showMember(Q.get("member")); } else if (Q.get("sheet") === "instance") showInstance(); });
  polling = setInterval(poll, 2000);
} else connect();
setInterval(() => { if (lastOK && Date.now() - lastOK > 8000) { $("#status").classList.add("stale"); } }, 2000);
</script>
