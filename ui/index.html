<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<title>cacheproxy · vis</title>
<style>
:root {
  color-scheme: light;
  --bg: #f7f7f6;
  --ink: #111112;
  --ink-2: #4a4a4f;
  --ink-3: #8a8a90;
  --ink-4: #c4c4c8;
  --rule: #b9b9be;
  --hair: #e4e4e1;
  --red: #d93036;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Geist Mono", Menlo, monospace;
  --serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  --ease-out: cubic-bezier(.22, 1, .36, 1);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0a0a0a; --ink: #ececec; --ink-2: #b0b0b5; --ink-3: #75757b; --ink-4: #3b3b40; --rule: #45454a; --hair: #1d1d20;
    --red: #ff5a5f;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { overscroll-behavior: none; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; min-height: 100dvh; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
/* keyboard hints: shown only once someone is using the keyboard */
.kbd { display: none; font: 11px/1 var(--mono); padding: 3px 5px; border: 1px solid currentColor; opacity: .55; margin-left: 8px; letter-spacing: 0; }
body.keys-on .kbd { display: inline-block; }
.label .k { display: none; } body.keys-on .label .k { display: inline; color: var(--ink-2); }
.keys-hint { display: none; } @media (pointer: fine) { .keys-hint { display: inline; } }
.strip:focus-visible { outline: 1px dotted var(--ink-2); outline-offset: 6px; }
.keys { display: grid; gap: 18px; margin-top: 16px; }
.keys h4 { font: 12px var(--mono); letter-spacing: .06em; color: var(--ink-3); margin: 0 0 6px; font-weight: 400; }
.keys dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; font-size: 14px; }
.keys dt { font: 12.5px var(--mono); } .keys dt span { border: 1px solid var(--rule); padding: 1px 6px; margin-right: 4px; }
.keys dd { margin: 0; color: var(--ink-2); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- page frame (borrowed from mdxcn: dotted rules, + at the joints) ---------- */
.page { width: min(1120px, 100%); margin: 0 auto; border-left: 1px dotted var(--rule); border-right: 1px dotted var(--rule); min-height: 100dvh; position: relative; }
header {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px;
  padding: calc(14px + env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) 14px max(24px, env(safe-area-inset-left));
  background: var(--bg); border-bottom: 1px dotted var(--rule);
}
header::before, header::after { content: "+"; position: absolute; bottom: -9px; font: 12px/1 var(--mono); color: var(--ink-3); background: var(--bg); }
header::before { left: -4px; } header::after { right: -4px; }
.svc { font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
.svc .mark { width: 14px; height: 14px; display: grid; grid-template-columns: repeat(3, 1fr); align-items: end; gap: 1px; }
.svc .mark i { background: var(--ink); } .svc .mark i:nth-child(1) { height: 5px; } .svc .mark i:nth-child(2) { height: 9px; } .svc .mark i:nth-child(3) { height: 14px; }
.svc small { font: 12px var(--mono); color: var(--ink-3); }
.grow { flex: 1; }
.freeze { min-height: 36px; padding: 0 14px; border: 1px solid var(--rule); font-size: 14px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; transition: background .2s, color .2s, border-color .2s; }
.freeze:hover { border-color: var(--ink-2); color: var(--ink); }
.freeze .sq { width: 8px; height: 8px; border: 1px solid currentColor; }
body.frozen .freeze { background: var(--ink); color: var(--bg); border-color: var(--ink); }
body.frozen .freeze .sq { background: currentColor; }
.freezebar { display: none; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 28px; background: var(--ink); color: var(--bg); font: 13px var(--mono); }
body.frozen .freezebar { display: flex; }
.freezebar b { font-weight: 600; letter-spacing: .06em; }
.freezebar input { flex: 1; min-width: 180px; background: transparent; border: 0; border-bottom: 1px dotted currentColor; color: inherit; font: inherit; padding: 4px 0; outline: none; }
.freezebar input::placeholder { color: inherit; opacity: .6; }
.freezebar button { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
@media (max-width: 600px) { .freezebar { padding: 10px 16px; } }

/* ---------- layout ---------- */
main { padding: 8px max(24px, env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); }
@media (min-width: 980px) {
  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 48px; align-items: start; }
  aside { position: sticky; top: 92px; }
}

/* ---------- frames ---------- */
.frame { position: relative; border: 1px dotted var(--rule); margin-top: 36px; }
.frame > .c { position: absolute; font: 12px/1 var(--mono); color: var(--ink-3); pointer-events: none; }
.frame > .c.tl { top: -7px; left: -4px; } .frame > .c.tr { top: -7px; right: -4px; } .frame > .c.bl { bottom: -6px; left: -4px; } .frame > .c.br { bottom: -6px; right: -4px; }
.frame > .label { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); background: var(--bg); padding: 0 8px; font: 12px/18px var(--mono); letter-spacing: .06em; color: var(--ink-2); white-space: nowrap; }
.frame > .inner { padding: 22px 20px 18px; }

/* ---------- hero ---------- */
.hero { padding-top: 36px; }
#headline { font: 600 clamp(34px, 7vw, 54px)/1.04 var(--display); letter-spacing: -0.04em; margin: 0; }
#headline.alert { color: var(--red); }
#headline.two { font-size: clamp(28px, 5.6vw, 44px); }
#subline { font: 14.5px/1.5 var(--mono); color: var(--ink-2); margin: 12px 0 0; min-height: 22px; }

/* ---------- tick strip ---------- */
.strip { position: relative; height: 96px; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: crosshair; }
.strip svg { width: 100%; height: 100%; display: block; overflow: visible; }
.strip .tick { stroke: var(--ink-4); stroke-width: 1; shape-rendering: crispEdges; }
.strip .tick.hot { stroke: var(--red); }
.strip .tick.ev { stroke: var(--ink); }
.strip .tick.dep { stroke-dasharray: 2 2; }
.strip .lbl.dep { font: 11.5px var(--mono); font-style: normal; }
.strip .tick.ev.hot { stroke: var(--red); } /* a landmark inside a breach stays red */
.strip .tick, .strip .lbl { transition: opacity .15s; }
.strip .band { fill: var(--ink); opacity: 0; transition: opacity .15s; }
.strip.hl .band { opacity: .07; }
.strip.hl .tick:not(.in), .strip.hl .lbl:not(.in) { opacity: .25; }
.strip .slo { stroke: var(--red); stroke-width: 1; stroke-dasharray: 1 3; opacity: .7; }
.strip .lbl { font: italic 12.5px var(--serif); fill: var(--ink-2); }
.strip .now { stroke: var(--ink); stroke-width: 1.5; }
.strip .hair { stroke: var(--ink); stroke-width: 1; opacity: 0; }
.strip .readout { position: absolute; top: calc(100% + 6px); font: 12px var(--mono); color: var(--ink); background: var(--bg); padding: 0 4px; white-space: nowrap; transform: translateX(-50%); opacity: 0; transition: opacity .15s; pointer-events: none; }
.strip.scrub .readout { opacity: 1; }
.strip.scrub + .axis { opacity: 0; }
.axis { display: flex; justify-content: space-between; font: 11.5px var(--mono); color: var(--ink-3); margin-top: 10px; }

/* ---------- stories ---------- */
.stories { display: grid; }
.story { padding: 16px 0; transition: opacity .15s; }
.stories.hl .story:not(.on) { opacity: .4 !important; } /* beats the entry animation's inline opacity */
.story.on .when .dot { background: var(--ink); }
.story.alert.on .when .dot { background: var(--red); outline: 1px solid var(--red); outline-offset: 2px; }
.story:focus-visible { outline: 1px dotted var(--ink-2); outline-offset: 4px; }
.story + .story { border-top: 1px dotted var(--rule); }
.story:first-child { padding-top: 2px; } .story:last-child { padding-bottom: 0; }
.story .when { font: 12px var(--mono); color: var(--ink-3); display: flex; gap: 8px; align-items: center; }
.story .when .dot { width: 6px; height: 6px; background: var(--ink-4); }
.story.alert .when .dot { background: var(--red); }
.story h3 { font: 600 16.5px/1.35 var(--sans); margin: 6px 0 4px; letter-spacing: -0.01em; }
.story p { margin: 0; color: var(--ink-2); }
.story .actions { display: flex; gap: 8px; margin-top: 14px; }
.btn { min-height: 38px; padding: 0 14px; border: 1px solid var(--ink); font-weight: 500; font-size: 14px; transition: transform .16s var(--ease-out), background .2s, color .2s; }
.btn.ink { background: var(--ink); color: var(--bg); }
.btn.quiet { border-color: transparent; color: var(--ink-2); padding: 0 8px; }
@media (hover: hover) and (pointer: fine) { .btn:not(.ink):not(:disabled):hover { background: var(--hair); } }
.btn:disabled { opacity: .35; cursor: default; }
.pressed { transform: scale(.97); }
.empty { color: var(--ink-3); font-size: 14px; }

/* ---------- knobs list ---------- */
.list { display: block; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 13px 20px; min-height: 58px; transition: background .15s; }
.row + .row { border-top: 1px dotted var(--rule); }
@media (hover: hover) and (pointer: fine) { .row:hover { background: var(--hair); } }
.row.pressed { transform: none; background: var(--hair); }
.row .name { font-weight: 550; }
.row .meta { font: 11.5px var(--mono); color: var(--ink-3); }
.row .meta.live { color: var(--ink-2); }
.row .val { margin-left: auto; font: 400 18px/1 var(--mono); letter-spacing: -0.02em; }
.row .val small { font: 11.5px var(--mono); color: var(--ink-3); margin-left: 4px; letter-spacing: 0; }
.row .chev { color: var(--ink-3); font: 13px var(--mono); margin-left: 2px; }
.fleet { display: flex; align-items: center; gap: 14px; }
.dots { display: flex; gap: 5px; }
.dots i { width: 9px; height: 9px; border: 1px solid var(--ink-3); transition: background .3s, border-color .3s; }
.dots i.hot { background: var(--red); border-color: var(--red); }
.demo { margin-top: 28px; font: 12px var(--mono); color: var(--ink-3); }
.demo button { text-decoration: underline; text-underline-offset: 3px; color: var(--ink-2); }

/* ---------- sheet ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 70%, transparent); opacity: 0; pointer-events: none; transition: opacity .3s var(--ease-out); }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; margin: 0 auto; width: min(480px, 100%);
  background: var(--bg); border: 1px solid var(--rule); border-bottom: 0; border-radius: 12px 12px 0 0;
  padding: 6px 24px calc(22px + env(safe-area-inset-bottom)); max-height: 92dvh; overflow: auto; overscroll-behavior: contain;
  transform: translateY(110%);
}
@media (min-width: 700px) { .sheet { bottom: auto; top: 50%; border-radius: 0; border-bottom: 1px solid var(--rule); padding-bottom: 24px; transform: translateY(-50%) scale(.98); opacity: 0; pointer-events: none; } .sheet.on { pointer-events: auto; } }
.grab { height: 20px; display: grid; place-items: center; touch-action: none; cursor: grab; }
.grab::before { content: ""; width: 32px; height: 4px; background: var(--ink-4); }
@media (min-width: 700px) { .grab { display: none; } }
.sheet h3 { font: 600 20px/1.2 var(--sans); margin: 10px 0 2px; letter-spacing: -0.015em; }
.sheet .desc { color: var(--ink-3); font-size: 14px; }

/* encoder */
.encoder { position: relative; width: 256px; height: 256px; margin: 10px auto 0; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
.encoder.turning { cursor: grabbing; }
.encoder svg { width: 100%; height: 100%; overflow: visible; }
.encoder .t { stroke: var(--ink-4); stroke-width: 1.5; }
.encoder .t.on { stroke: var(--ink); }
.encoder .t.def { stroke: var(--ink-2); }
.encoder .cap { fill: none; stroke: var(--rule); stroke-width: 1; stroke-dasharray: 1 3; }
.encoder .needle { stroke: var(--ink); stroke-width: 2; }
.encoder .optl { font: 12px var(--mono); fill: var(--ink-3); }
.encoder .optl.on { fill: var(--ink); }
.encoder .readout { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center; }
.encoder .big { font: 400 46px/1 var(--mono); letter-spacing: -0.04em; }
.encoder .unit { font: 12px var(--mono); color: var(--ink-3); margin-top: 6px; }
.encoder .was { font: 12px var(--mono); color: var(--ink-3); height: 18px; margin-top: 2px; }
.who { text-align: center; color: var(--ink-2); font-size: 14px; margin: 2px 0 18px; min-height: 21px; }
.history { border-top: 1px dotted var(--rule); padding-top: 14px; }
.history .h { font: 12px var(--mono); letter-spacing: .06em; color: var(--ink-3); margin-bottom: 8px; }
.history ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.history li { display: flex; gap: 12px; }
.history li span:first-child { color: var(--ink-3); min-width: 72px; font: 12.5px/21px var(--mono); }
.history li b { font-weight: 550; }
.why { border: 1px dotted var(--rule); padding: 12px 14px; font-size: 14px; color: var(--ink-2); margin: 14px 0 4px; }
.choose { display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; align-items: center; margin: 18px 0; font: 12px var(--mono); color: var(--ink-3); }
.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--rule); }
.seg button { position: relative; z-index: 1; min-height: 34px; font-size: 13.5px; color: var(--ink-2); transition: color .2s; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button.on { color: var(--bg); }
.seg .ind { position: absolute; top: -1px; bottom: -1px; left: 0; background: var(--ink); transition: transform .3s var(--ease-out), width .3s var(--ease-out); }
.apply { width: 100%; min-height: 48px; font-size: 15px; }
body.keys-on .apply[data-kbd]:not(:disabled)::after { content: attr(data-kbd); font: 11px/1 var(--mono); padding: 3px 5px; border: 1px solid currentColor; opacity: .55; margin-left: 10px; }
.plan { border: 1px dotted var(--rule); padding: 10px 12px; margin: 0 0 12px; font-size: 14px; color: var(--ink-2); }
.plan .h { font: 12px var(--mono); letter-spacing: .06em; color: var(--ink-3); margin-bottom: 4px; }
.plan b { color: var(--ink); font-weight: 550; }
.plan.blocked { border-color: var(--red); }
.plan:empty { display: none; }
.cmd { display: flex; gap: 10px; align-items: flex-start; margin-top: 10px; padding-top: 8px; border-top: 1px dotted var(--rule); }
.cmd code { flex: 1; font: 12px/1.5 var(--mono); color: var(--ink-2); word-break: break-word; }
.copy { font: 12px var(--mono); color: var(--ink-3); text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
.copy:hover { color: var(--ink); }
.story .when .copy { margin-left: auto; text-decoration: none; }
.copyall { justify-self: start; margin-top: 14px; }
.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translate(-50%, 200%); opacity: 0; background: var(--ink); color: var(--bg); padding: 11px 16px; font-size: 14px; max-width: calc(100% - 32px); white-space: nowrap; }
.toast button { color: inherit; text-decoration: underline; text-underline-offset: 3px; margin-left: 12px; }
.inst { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px dotted var(--rule); font-size: 14px; }
.inst:first-of-type { border-top: 0; }
.inst b { font: 500 13px var(--mono); }
.bar { height: 4px; background: var(--hair); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink-2); }
.bar i.hot { background: var(--red); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 600px) { .frame > .inner { padding: 20px 16px 16px; } .row { padding: 12px 16px; } main { padding-left: 16px; padding-right: 16px; } header { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<div class="page">
<header>
  <div class="svc"><span class="mark"><i></i><i></i><i></i></span>cacheproxy<small>vis</small></div>
  <div class="grow"></div>
  <button class="freeze" id="freezeBtn" aria-pressed="false" aria-keyshortcuts="f Shift+F" title="Stop rules, agents and rollouts from changing knobs. Every knob holds its value."><span class="sq"></span><span id="freezeLbl">Freeze</span><span class="kbd" id="freezeKbd">F</span></button>
</header>
<div class="freezebar" id="freezeBar" role="status">
  <b>[ FROZEN ]</b><span id="freezeWho"></span>
  <input id="freezeWhy" placeholder="why? (optional, shown to everyone)" aria-label="Reason for the freeze">
  <button id="unfreezeBtn">Unfreeze</button>
</div>

<main>
  <div>
    <section class="hero">
      <h1 id="headline">All good.</h1>
      <p id="subline"></p>
      <div class="frame"><span class="label">[ P99 · LAST HOUR<span class="k"> · t</span> ]</span><div class="inner">
        <div class="strip" id="strip" tabindex="0" role="slider" aria-keyshortcuts="t" aria-label="p99 latency over the last hour. Arrow keys move through time, brackets jump between events, Enter opens the matching story.">
          <svg id="stripSvg"></svg>
          <div class="readout" id="readout"></div>
        </div>
        <div class="axis" id="axis"><span>-60m</span><span>-30m</span><span>now</span></div>
      </div></div>
    </section>

    <div class="frame"><span class="label">[ TODAY<span class="k"> · j k</span> ]</span><div class="inner"><div class="stories" id="stories" role="list" aria-label="Today" aria-keyshortcuts="j k"></div></div></div>
  </div>

  <aside>
    <div class="frame"><span class="label">[ KNOBS<span class="k"> · 1–5</span> ]</span><div class="list" id="knobList" style="padding:10px 0 4px"></div></div>

    <div class="frame"><span class="label">[ INSTANCES<span class="k"> · i</span> ]</span><div style="padding:8px 0 2px"><button class="row fleet" id="fleetBtn" aria-keyshortcuts="i">
      <span class="dots" id="dots"></span>
      <span class="meta live" id="fleetTxt">all 7 healthy</span>
      <span class="chev" style="margin-left:auto">→</span>
    </button></div></div>

    <div class="demo">demo data · simulate <button id="spikeBtn">a traffic spike</button> · <button id="leakBtn">a memory leak</button><span class="keys-hint"> · <button id="keysBtn">press ? for keys</button></span></div>
  </aside>
</main>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="grab" id="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast" role="status"></div>

<script type="module">
/* ---------------- motion ---------------- */
let M = null;
try { M = await import("https://cdn.jsdelivr.net/npm/motion@14.9.0/+esm"); } catch {}
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
// Emil's rules: entering/exiting -> ease-out; moving on screen -> spring; constant -> linear
function spring(el, kf, o = {}) {
  const end = () => { for (const [k, v] of Object.entries(kf)) el.style[k] = Array.isArray(v) ? v[v.length - 1] : v; };
  if (REDUCED) return end();
  if (M) return M.animate(el, kf, { type: M.spring, bounce: o.bounce ?? 0.18, visualDuration: o.d ?? 0.4, delay: o.delay ?? 0 });
  const a = el.animate(kf, { duration: (o.d ?? .4) * 1000, easing: "cubic-bezier(.22,1,.36,1)", fill: "forwards" }); a.onfinish = end; return a;
}
function tween(ms, fn, ease = t => 1 - Math.pow(1 - t, 3)) {
  return new Promise(res => {
    if (REDUCED) { fn(1); return res(); }
    const t0 = performance.now();
    const step = now => { const t = Math.min(1, (now - t0) / ms); fn(ease(t)); t < 1 ? requestAnimationFrame(step) : res(); };
    requestAnimationFrame(step);
  });
}
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const fmt = v => typeof v === "number" ? Math.round(v).toLocaleString() : v;
// feedback on pointer-down, not on release
document.addEventListener("pointerdown", e => {
  const b = e.target.closest(".btn, .row"); if (!b) return;
  b.classList.add("pressed");
  const up = () => { b.classList.remove("pressed"); removeEventListener("pointerup", up); removeEventListener("pointercancel", up); };
  addEventListener("pointerup", up); addEventListener("pointercancel", up);
});

/* ---------------- clock: 1 real second = one 10 s bucket ---------------- */
const SPEED = 10, T0 = performance.now();
const now = () => (performance.now() - T0) / 1000 * SPEED;
const BASE = new Date(); BASE.setHours(14, 20, 0, 0);
const clock = s => new Date(BASE.getTime() + s * 1000).toTimeString().slice(0, 5);
const left = s => { s = Math.max(1, Math.round(s / 60)); return s < 60 ? `${s} min` : `${Math.floor(s / 60)} h ${s % 60} min`; };

/* ---------------- state ---------------- */

  renderKnobs(); bumpKnob("BatchSize");
  S.events.push({ i: 359, label: `rule: BatchSize ${to}` });
  if (spikeStory) { spikeStory.body = `Scheduler latency stayed over ${target} ms for 30 s, so a rule lowered BatchSize ${from} → ${to} there. It reverts on its own.`; renderStories(); }
}
function spikeTick() {
  const p = S.series[359], over = p > 50;
  if (over && !spikeStory) lastSpike = spikeStory = story({ t0: spikeStart, live: true, alert: true, src: "cp-5, cp-6", title: "Latency spiked on cp-5 and cp-6.", body: "A scan-heavy tenant arrived. A flight recording was saved." });
  if (spikeStory) peak = Math.max(peak, p);
  if (spikeStory && !over && S.spike < .15) {
    spikeStory.alert = false; spikeStory.live = false; spikeStory.t1 = now();
    spikeStory.title = "Latency spiked on cp-5 and cp-6, and recovered.";
    const r = K.BatchSize.layers.rule;
    spikeStory.body = `p99 peaked at ${peak.toFixed(0)} ms for about ${Math.max(1, Math.round((now() - spikeStart) / 60))} min.${r ? ` A rule lowered BatchSize to ${r.v}, which helped it settle.` : ""} A flight recording was saved.`;
    renderStories(); spikeStory = null;
    if (!S.suggested) setTimeout(suggest, 3500);
  }
}
// A second, unrelated problem: cp-7 (the only instance on the older build) leaks memory.
let leakStory = null;
function startLeak() { if (INST[6].leak == null) { INST[6].leak = 82; INST[6].leakT0 = now(); } }
$("#leakBtn").onclick = startLeak;
setTimeout(startLeak, 1000); // starts alone, overlaps the spike, ends first: one, two, then one problem
function leakTick() {
  const c = INST[6];
  if (c.leak == null) return;
  c.leak += .6; c.mem = c.leak;
  if (c.mem > 85 && !leakStory) leakStory = story({ t0: c.leakT0, live: true, alert: true, src: "cp-7", title: "cp-7 is running low on memory.", body: `Heap is past 85% of its limit and climbing about 4 points a minute. cp-7 is the only instance on the older build, 7a1b0d4; the ${clock(DEPLOY_T)} deploy skipped it.` });
  if (c.leak >= 96) {
    c.leak = null; c.mem = 41; c.restartedAt = now();
    S.events.push({ i: 359, label: "cp-7 restarted" });
    if (leakStory) {
      leakStory.alert = false; leakStory.live = false; leakStory.t1 = now(); leakStory.title = "cp-7 ran out of memory and restarted.";
      leakStory.body = "It came back on the older build, 7a1b0d4, with default knob values, so the leak will likely return. The other six run 9f3c2e1 and stayed flat.";
      renderStories(); leakStory = null;
    }
  }
}
function suggest() {
  S.suggested = true;
  const to = Math.round(eff(K.CacheSize).v * 1.4 / 50) * 50;
  const p = { to, why: "Hit rate on cp-5 and cp-6 dropped to 71% during the spike. The last time CacheSize went up like this, p99 fell about 5 ms." };
  p.story = story({ t0: lastSpike?.t0, t1: lastSpike?.t1, src: "suggested by the agent", title: `Grow CacheSize to ${fmt(to)} MiB on cp-5 and cp-6?`, body: "Hit rate there is 71% and evictions are high. It would revert on its own after 30 min.",
    actions: [{ label: "Review", fn: () => openKnob(K.CacheSize, p) }, { label: "Dismiss", fn: () => dropStory(p.story) }] });
}

/* ---------------- main loop: one bucket per second ---------------- */
let minute = -1;
setInterval(() => {
  S.spike += ((performance.now() < S.spikeUntil ? 1 : 0) - S.spike) * .25;
  S.series.push(point()); S.series.shift();
  S.events.forEach(e => e.i--); S.events = S.events.filter(e => e.i >= 0);
  S.sched = 1.6 + S.spike * 7.5 * (eff(K.BatchSize).v / 64) + rnd(-.2, .2);
  INST.forEach((inst, i) => { const hotOne = i === 4 || i === 5; inst.cpu = clamp((hotOne ? 48 : 38) + S.spike * (hotOne ? 45 : 8) + rnd(-5, 5), 5, 99); inst.mem = inst.memBase + S.spike * 6 + rnd(-1.5, 1.5); });
  leakTick();
  drawStrip(); if (scrubX != null) scrub({ clientX: scrubX }); else if (kbBin != null) scrubBin(kbBin); headline(); renderFreeze(); renderFleet(); ruleTick(); spikeTick();
  while (lapsed.length) { const [k, L] = lapsed.shift(); if (L === "rule") story({ src: "rule", title: `${k.name} is back to ${fmt(eff(k).v)}.`, body: "The rule's lease ran out once load was back to normal." }); if (L === "pin") story({ src: "you", title: `${k.name} is back to ${fmt(eff(k).v)}.`, body: "Your pin ran its course. Make it permanent by changing the default in code." });
    if (L === "agent") story({ src: "approved suggestion", title: `${k.name} is back to ${fmt(eff(k).v)}.`, body: "The approved change ran its course." }); renderKnobs(); }
  const m = Math.floor(now() / 60); if (m !== minute) { minute = m; renderKnobs(); }
}, 1000);

document.querySelectorAll(".frame").forEach(f => ["tl", "tr", "bl", "br"].forEach(c => { const e = document.createElement("span"); e.className = "c " + c; e.textContent = "+"; f.appendChild(e); }));
renderKnobs(); renderFleet(); headline(); buildStrip();
</script>
</body>
