name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code
      - name: integrations
        run: |
          for m in integrations/visgin integrations/visecho; do
            (cd "$m" && go vet ./... && go test -race ./...)
          done
